<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>HTML H1 Parágrafo Botão</title>
</head>
<body style="background:#b8f0ff; font-family:sans-serif; padding:40px; font-size:17px;">

    <h1 style="margin:0 0 10px; font-size:22px;">
        SEU H1 AQUI
    </h1>

    <p style="margin:0 0 40px; font-size:17px;">
        Parágrafo
    </p>

    <button type="button" onclick="this.style.transform = 'translateY(9px)'; this.style.boxShadow = '0 0 #666'; setTimeout(() => { this.style.transform = ''; this.style.boxShadow = '0 9px #999'; }, 150);" onmouseover="this.style.background = '#c2f8ff';" onmouseout="this.style.background = '#99f3ff';" style="box-shadow:0 9px #999; background:#99f3ff; border:0; padding:10px 20px; font-size:17px; cursor:pointer; transition:transform 0.1s, box-shadow 0.1s;">
        Seu botão aqui
    </button>

</body>
</html>
